{% extends "base.html" %}

{% block title %}Password Reset Sent - Django Base App{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check" style="font-size: 3rem;"></i>
                <h4 class="mt-3">Check Your Email</h4>
                <p class="text-muted">If an account exists with that email, we've sent password reset instructions.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
